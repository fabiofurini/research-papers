- id: J02
  title: A Column Generation Heuristic for the Two-Dimensional Two-Staged Guillotine Cutting Stock Problem
    with Multiple Stock Size
  authors:
  - F. Furini
  - E. Malaguti
  - R. Medina Durán
  - A. Persiani
  - P. Toth
  year: 2012
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2011.10.018
  themes:
  - bin-packing-cutting-stock
  folder: J02_2012_EJOR_column-generation-heuristic-two-dimensional-two
  code_url: null
  abstract: We consider a two-dimensional cutting stock problem where stock of different sizes is available,
    and a set of rectangular items has to be obtained through two-staged guillotine cuts. We propose a
    heuristic algorithm, based on column generation, which requires as its subproblem the solution of
    a two-dimensional knapsack problem with two-staged guillotines cuts. A further contribution of the
    paper consists in the definition of a mixed integer linear programming model for the solution of this
    knapsack problem, as well as a heuristic procedure based on dynamic programming. Computational experiments
    show the effectiveness of the proposed approach, which obtains very small optimality gaps and outperforms
    the heuristic algorithm proposed by Cintra et al. [3]
- id: J03
  title: Uncommon Dantzig-Wolfe Reformulation for the Temporal Knapsack Problem
  authors:
  - A. Caprara
  - F. Furini
  - E. Malaguti
  year: 2013
  kind: journal
  venue: INFORMS Journal on Computing, INFORMS.
  doi: 10.1287/ijoc.1120.0521
  themes:
  - knapsack
  folder: J03_2013_IJOC_uncommon-dantzig-wolfe-reformulation-temporal-knapsack
  code_url: null
  abstract: We study a natural generalization of the knapsack problem, in which each item exists only
    for a given time interval. One has to select a subset of the items (as in the classical case), guaranteeing
    that for each time instant the set of existing selected items has total weight not larger than the
    knapsack capacity. We focus on the exact solution of the problem, noting that prior to our work the
    best method was the straightforward application of a general-purpose solver to the natural ILP formulation.
    Our results indicate that much better results can be obtained by using the same general-purpose solver
    to tackle a nonstandard Dantzig-Wolfe reformulation in which subproblems are associated with groups
    of constraints. This is also interesting since the more natural Dantzig-Wolfe reformulation of single
    constraints performs extremely poorly in practice.
- id: J04
  title: Models for the Two-Dimensional Two-Stage Cutting Stock Problem with Multiple Stock Size
  authors:
  - F. Furini
  - E. Malaguti
  year: 2013
  kind: journal
  venue: Computer & Operations Research, Elsevier.
  doi: 10.1016/j.cor.2013.02.026
  themes:
  - bin-packing-cutting-stock
  folder: J04_2013_COR_models-two-dimensional-two-stage-cutting
  code_url: null
  abstract: 'Keywords: Cutting stock problem Mixed-integer programming models Computational experiments
    We consider a Two-Dimensional Cutting Stock Problem (2DCSP) where stock of different sizes is available,
    and a set of rectangular items has to be obtained through two-stage guillotine cuts. We propose and
    computationally compare three Mixed-Integer Programming models for the 2DCSP developing formulations
    from the literature. The first two models have a polynomial and pseudopolynomial number of variables,
    respectively, and can be solved with a general-purpose MIP solver. The third model, having an exponential
    number of variables, is solved via branch-and-price techniques. We conclude the paper describing the
    results of extensive computational experiments on a set of benchmark instances from the literature'
