- id: J15
  title: An improved DSATUR-based Branch and Bound for the Vertex Coloring Problem
  authors:
  - F. Furini
  - V. Gabrel
  - I. C. Ternier
  year: 2017
  kind: journal
  venue: Networks, Wiley.
  doi: 10.1002/net.21716
  themes:
  - graph-coloring
  folder: J15_2017_NETWORKS_improved-dsatur-based-branch-bound-vertex
  code_url: null
  abstract: Given an undirected graph, the Vertex Coloring Problem (VCP) consists of assigning a color
    to each vertex of the graph in such a way that two adjacent vertices do not share the same color and
    the total number of colors is minimized. DSATUR-based Branch-and-Bound algorithm (DSATUR) is an effective
    exact algorithm for the VCP. One of its main drawback is that a lower bound is computed only once
    and it is never updated. We introduce a reduced graph which allows the computation of lower bounds
    at nodes of the branching tree. We compare the effectiveness of different classical VCP bounds, plus
    a new lower bound based on the $1$-to-$1$ mapping between VCPs and Stable Set Problems. Our new DSATUR
    outperforms the state of the art for random VCP instances with high density, significantly increasing
    the size of instances solved to proven optimality.
- id: J16
  title: An effective dynamic programming algorithm for the minimum-cost maximal knapsack packing problem
  authors:
  - F. Furini
  - I. Ljubić
  - M. Sinnl
  year: 2017
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2017.03.061
  themes:
  - knapsack
  folder: J16_2017_EJOR_effective-dynamic-programming-algorithm-minimum-cost
  code_url: null
  abstract: Given a set of items with profits and weights and a knapsack capacity, we study the problem
    of finding a maximal knapsack packing that minimizes the profit of the selected items. We propose
    an effective dynamic programming (DP) algorithm which has a pseudo-polynomial time complexity. We
    demonstrate the equivalence between this problem and the problem of finding a minimal knapsack cover
    that maximizes the profit of the selected items. In an extensive computational study on a large and
    diverse set of benchmark instances, we demonstrate that the new DP algorithm outperforms a state-of-the-art
    commercial mixed-integer programming (MIP) solver applied to the two best performing MIP models from
    the literature
- id: J17
  title: Improving the Approximated Projected Perspective Reformulation by Dual Information
  authors:
  - A. Frangioni
  - F. Furini
  - C. Gentile
  year: 2017
  kind: journal
  venue: Operations Research Letters, Elsevier.
  doi: 10.1016/j.orl.2017.08.001
  themes:
  - decomposition-reformulation
  folder: J17_2017_ORL_improving-approximated-projected-perspective-reformulation-by
  code_url: null
  abstract: We propose an improvement of the Approximated Projected Perspective Reformulation (AP2 R)
    for dealing with constraints linking the binary variables. The new approach solves the Perspective
    Reformulation (PR) once, and then use the corresponding dual information to reformulate the problem
    prior to applying AP2 R, thereby combining the root bound quality of the PR with the reduced relaxation
    computing time of AP2 R. Computational results for the cardinality-constrained Mean–Variance portfolio
    optimization problem show that the new approach is competitive with state-of-the-art ones. Mixed-Integer
    Non-Linear Problems Semi-continuous variables Perspective reformulation Projection Lagrangian relaxation
    Portfolio optimization
- id: J18
  title: Exact Approaches for the Knapsack Problem with Setups
  authors:
  - F. Furini
  - M. Monaci
  - E. Traversi
  year: 2018
  kind: journal
  venue: Computer & Operations Research, Elsevier.
  doi: 10.1016/j.cor.2017.09.019
  themes:
  - knapsack
  folder: J18_2018_COR_exact-approaches-knapsack-setups
  code_url: null
  abstract: We consider a generalization of the knapsack problem in which items are partitioned into classes,
    each characterized by a fixed cost and capacity. We study three alternative Integer Linear Programming
    formulations. For each formulation, we design an eﬃcient algorithm to compute the linear programming
    relaxation (one of which is based on Column Generation techniques). We theoretically compare the strength
    of the relaxations and derive specific results for a relevant case arising in benchmark instances
    from the literature. Finally, we embed the algorithms above into a unified implicit enumeration scheme
    which is run in parallel with an improved Dynamic Programming algorithm to effectively solve the problem
    to proven optimality. An extensive computational analysis shows that our new exact algorithm is capable
    of eﬃciently solving all the instances of the literature and turns out to be the best algorithm for
    instances with a low number of classes
- id: J19
  title: Tighter MIP formulations for Barge Container Ship Routing
  authors:
  - L. Alfandari
  - T. Davidovic
  - F. Furini
  - I. Ljubic
  - V. Maras and S. Martin
  year: 2019
  kind: journal
  venue: Omega, Elsevier.
  doi: 10.1016/j.omega.2017.12.002
  themes:
  - transportation-scheduling
  folder: J19_2019_OMEGA_tighter-mip-formulations-barge-container-ship
  code_url: null
  abstract: This paper addresses the problem of optimal planning of a liner service for a barge container
    shipping company. Given estimated weekly demands between pairs of ports, our goal is to determine
    the subset of ports to be called and the amount of containers to be shipped between each pair of ports,
    so as to maximize the profit of the shipping company. In order to save possible leasing or storage
    costs of empty containers at the respective ports, our approach takes into account the repositioning
    of empty containers. The line has to follow the outbound–inbound principle, starting from the port
    at the river mouth. We propose a novel integrated approach in which the shipping company can simultaneously
    optimize the route (along with repositioning of empty containers), the choice of the final port, length
    of the turnaround time and the size of its fleet. To solve this problem, a new mixed integer programming
    model is proposed. On the publicly available set of benchmark instances for barge container routing,
    we demonstrate that this model provides very tight dual bounds and significantly outperforms the existing
    approaches from the literature for splittable demands. We also show how to further improve this model
    by projecting out arc variables for modeling the shipping of empty containers. Our numerical study
    indicates that the latter model improves the computing times for the challenging case of unsplittable
    demands. We also study the impact of the turnaround time optimization on the total profit of the company
- id: J20
  title: On the Product Knapsack Problem
  authors:
  - C. D'Ambrosio
  - F. Furini
  - M. Monaci
  - E. Traversi
  year: 2018
  kind: journal
  venue: Optimization Letters, Springer.
  doi: 10.1007/s11590-017-1227-5
  themes:
  - knapsack
  folder: J20_2018_OPTLETT_product-knapsack
  code_url: null
  abstract: Given a set of items, each characterized by a profit and a weight, we study the problem of
    maximizing the product of the profits of the selected items, while respecting a given capacity. To
    the best of our knowledge this is the first manuscript that studies this variant of the knapsack problem
    which we call Product Knapsack Problem (PKP). We show that PKP is weakly NP-hard. We propose and implement
    a Dynamic Programming algorithm and different Mixed Integer Linear and Nonlinear Programming formulations
    for the PKP. Finally, we present an extensive computa- tional study on a large set of benchmark instances
    derived from the literature
- id: J21
  title: An Exact Algorithm for the Partition Coloring Problem
  authors:
  - F. Furini
  - E. Malaguti and A. Santini
  year: 2018
  kind: journal
  venue: Computer & Operations Research, Elsevier.
  doi: 10.1016/j.cor.2017.12.019
  themes:
  - graph-coloring
  folder: J21_2018_COR_exact-algorithm-partition-coloring
  code_url: null
  abstract: We study the Partition Coloring Problem (PCP), a generalization of the Vertex Coloring Problem
    where the vertex set is partitioned. The PCP asks to select one vertex for each subset of the partition
    in such a way that the chromatic number of the induced graph is minimum. We propose a new Integer
    Linear Programming formulation with an exponential number of variables. To solve this formulation
    to optimality, we design an effective Branch-and-Price algorithm. Good quality initial solutions are
    computed via a new metaheuristic algorithm based on adaptive large neighborhood search. Extensive
    computational experiments on a benchmark test of instances from the literature show that our Branch-and-Price
    algorithm, combined with the new metaheuristic algorithm, is able to solve for the first time to proven
    optimality several open instances, and compares favorably with the current state-of-the-art exact
    algorithm
- id: J22
  title: The Vertex k-cut Problem
  authors:
  - D. Cornaz
  - F. Furini
  - M. Lacroix
  - E. Malaguti
  - A. R. Mahjoub
  - S. Martin
  year: 2019
  kind: journal
  venue: Discrete Optimization, Elsevier.
  doi: 10.1016/j.disopt.2018.07.003
  themes:
  - interdiction-blocker-vertex-cut
  folder: J22_2019_DISOPT_vertex-k-cut
  code_url: null
  abstract: Given an undirected graph G = (V, E), a vertex k-cut of G is a vertex subset of V the removing
    of which disconnects the graph in at least k components. Given a graph G and an integer k ≥ 2, the
    vertex k-cut problem consists in finding a vertex k-cut of G of minimum cardinality. We first prove
    that the problem is NP-hard for any fixed k ≥ 3. We then present a compact formulation, and an extended
    formulation from which we derive a column generation and a branching scheme. Vertex cut Extensive
    computational results prove the effectiveness of the proposed methods. Mixed-integer programming models
    Branch and Price Exact algorithms
- id: J23
  title: 'QPLIB: A Library of Quadratic Programming Instances'
  authors:
  - F. Furini
  - E. Traversi
  - P. Belotti
  - A. Frangioni
  - A. Gleixner
  - N. Gould
  - L. Liberti
  - A. Lodi
  - R. Misener
  - H. Mittelmann
  - N. Sahinidis
  - S. Vigerske and A. Wiegele
  year: 2019
  kind: journal
  venue: Mathematical Programming Computation, Springer.
  doi: 10.1007/s12532-018-0147-4
  themes:
  - quadratic-programming
  folder: J23_2019_MPC_qplib-library-quadratic-programming-instances
  code_url: https://github.com/fabiofurini/QPLIB
  abstract: This paper describes a new instance library for quadratic programming (QP), i.e., the family
    of continuous and (mixed)-integer optimization problems where the objective function and/or the constraints
    are quadratic. QP is a very diverse class of prob- lems, comprising sub-classes ranging from trivial
    to undecidable. This diversity is reflected in the variety of QP solution methods, ranging from entirely
    combinatorial approaches to completely continuous algorithms, including many methods for which both
    aspects are fundamental. Selecting a set of instances of QP that is at the same time not overwhelmingly
    onerous but sufficiently challenging for the different, interested communities is therefore important.
    We propose a simple taxonomy for QP instances leading to a systematic problem selection mechanism.
    We then briefly survey the field of QP, giving an overview of theory, methods and solvers. Finally,
    we describe how the library was put together, and detail its final contents
- id: J24
  title: Theoretical and computational study of several linearisation techniques for Binary Quadratic
    Problems
  authors:
  - F. Furini
  - E. Traversi
  year: 2019
  kind: journal
  venue: Annals of Operations Research, Springer.
  doi: 10.1007/s10479-018-3118-2
  themes:
  - quadratic-programming
  folder: J24_2019_AOR_theoretical-computational-study-several-linearisation-techniques
  code_url: null
  abstract: We perform a theoretical and computational study of the classical linearisation techniques
    (LT) and we propose a new LT for binary quadratic problems (BQPs). We discuss the relations between
    the linear programming (LP) relaxations of the considered LT for generic BQPs. We prove that for a
    specific class of BQP all the LTs have the same LP relaxation value. We also compare the LT computational
    performance for four different BQPs from the literature. We consider the Unconstrained BQP and the
    maximum cut of edge-weighted graphs and, in order to measure the effects of constraints on the computational
    performance, we also consider the quadratic extension of two classical combinatorial optimization
    problems, i.e., the knapsack and stable set problems
- id: J25
  title: Benders Decomposition for Very Large Scale Partial Set Covering and Maximal Covering Location
    Problems
  authors:
  - J.F. Cordeau
  - F. Furini
  - I. Ljubic
  year: 2019
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2018.12.021
  themes:
  - covering-location-submodular
  folder: J25_2019_EJOR_benders-decomposition-very-large-scale-partial
  code_url: https://github.com/fabiofurini/LocationCovering
  abstract: 'Covering problems constitute a fundamental family of facility location problems. This paper
    introduces a new exact algorithm for two important members of this family: (i) the maximal covering
    location problem (MCLP), which requires finding a subset of facilities that maximizes the amount of
    customer demand covered while respecting a budget constraint on the cost of the facilities; and (ii)
    the partial set covering location problem (PSCLP), which minimizes the cost of the open facilities
    while forcing a certain amount of customer demand to be covered. We study an effective decomposition
    approach to the two problems based on the branch-and-Benders-cut reformulation. Our new approach is
    designed for the realistic case in which the number of customers is much larger than the number of
    potential facility locations. We report the results of a series of computational experiments demonstrating
    that, thanks to this decomposition techniques, optimal solutions can be found very quickly for some
    benchmark instances with one hundred potential facility locations and involving up to 15 and 40 million
    customer demand points for the MCLP and the PSCLP, respectively'
- id: J26
  title: The Maximum Clique Interdiction Problem
  authors:
  - F. Furini
  - I. Ljubic
  - S. Martin
  - P. San Segundo
  year: 2019
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2019.02.028
  themes:
  - clique-stable-set
  folder: J26_2019_EJOR_maximum-clique-interdiction
  code_url: null
  abstract: Given a graph G and an interdiction budget k, the Maximum Clique Interdiction Problem asks
    to find a subset of at most k vertices to remove from G so that the size of the maximum clique in
    the remaining graph is minimized. This problem has applications in many areas, such as crime detection,
    prevention of outbreaks of infectious diseases and surveillance of communication networks. We propose
    an integer linear programming formulation of the problem based on an exponential family of Clique-Interdiction
    Cuts and we give necessary and suﬃcient conditions under which these cuts are facet-defining. Our
    new approach provides a useful tool for analyzing the resilience of (social) networks with respect
    to clique-interdiction attacks, i.e., the decrease of the size of the maximum clique as a function
    of an incremental interdiction budget level. On a benchmark set of publicly available instances, including
    large-scale social networks with up to one hundred thousand vertices and three million edges, we show
    that most of them can be analyzed and solved to proven optimality within short computing time
- id: J27
  title: A new branch-and-bound algorithm for the maximum edge-weighted clique problem
  authors:
  - P. San Segundo
  - S. Coniglio
  - F. Furini
  - I. Ljubic
  year: 2019
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2019.03.047
  themes:
  - clique-stable-set
  folder: J27_2019_EJOR_branch-bound-algorithm-maximum-edge-weighted
  code_url: https://github.com/psanse/BBEWC
  abstract: We study the maximum edge-weighted clique problem, a problem related to the maximum (vertexweighted)
    clique problem which asks for finding a complete subgraph (i.e., a clique) of maximum total weight
    on its edges. The problem appears in a wide range of applications, including bioinformatics, material
    science, computer vision, robotics, and many more. In this work, we propose a new combinatorial branch-and-bound
    algorithm for the problem which relies on a novel bounding procedure capable of pruning a very large
    amount of nodes of the branch-and-bound tree. Extensive computational experiments on random and structured
    graphs, encompassing standard benchmarks used in the literature as well as recently introduced real-world
    large-scale graphs, show that our new algorithm outperforms the state-of-the-art by several orders
    of magnitude on many instances
- id: J28
  title: A new branch-and-bound algorithm for the Maximum Weighted Clique Problem
  authors:
  - P. San Segundo
  - F. Furini
  - J. Artieda
  year: 2019
  kind: journal
  venue: Computer & Operations Research, Elsevier.
  doi: 10.1016/j.cor.2019.05.017
  themes:
  - clique-stable-set
  folder: J28_2019_COR_branch-bound-algorithm-maximum-weighted-clique
  code_url: null
  abstract: We study the Maximum Weighted Clique Problem (MWCP), a generalization of the Maximum Clique
    Problem in which weights are associated with the vertices of a graph. The MWCP calls for determining
    a complete subgraph of maximum weight. We design a new combinatorial branch-and-bound algorithm for
    the MWCP, which relies on an effective bounding procedure. The size of the implicit enumeration tree
    is largely reduced via a tailored branching scheme, specifically conceived for the MWCP. The new bounding
    function extends the classical MWCP bounds from the literature to achieve a good trade off between
    pruning potential and computing effort. We perform extensive tests on random graphs, graphs from the
    literature and real-world graphs, and we computationally show that our new exact algorithm is competitive
    with the state-of-the-art algorithms for the MWCP in all these classes of instances
- id: J29
  title: On Integer and Bilevel Formulations for the k-Vertex Cut Problem
  authors:
  - F. Furini
  - I. Ljubic
  - E. Malaguti
  - P. Paronuzzi
  year: 2020
  kind: journal
  venue: Mathematical Programming Computation, Springer.
  doi: 10.1007/s12532-019-00167-1
  themes:
  - interdiction-blocker-vertex-cut
  folder: J29_2020_MPC_integer-bilevel-formulations-k-vertex-cut
  code_url: null
  abstract: The family of critical node detection problems asks for finding a subset of vertices, deletion
    of which minimizes or maximizes a predefined connectivity measure on the remaining network. We study
    a problem of this family called the k-vertex cut problem. The problem asks for determining the minimum
    weight subset of nodes whose removal disconnects a graph into at least k components. We provide two
    new integer linear programming formulations, along with families of strengthening valid inequalities.
    Both models involve an exponential number of constraints for which we provide poly- time separation
    procedures and design the respective branch-and-cut algorithms. In the first formulation one representative
    vertex is chosen for each of the k mutually disconnected vertex subsets of the remaining graph. In
    the second formulation, the model is derived from the perspective of a two-phase Stackelberg game
    in which a leader deletes the vertices in the first phase, and in the second phase a follower builds
    connected components in the remaining graph. Our computational study demonstrates that a hybrid model
    in which valid inequalities of both formulations are combined significantly outperforms the state-of-the-art
    exact methods from the literature. B Ivana Ljubić ivana.ljubic@essec.edu Fabio Furini fabio.furini@dauphine.fr
    Enrico Malaguti enrico.malaguti@unibo.it Paolo Paronuzzi paolo.paronuzzi@unibo.it 1 LAMSADE, Université
    Paris-Dauphine, Paris, France 2 ESSEC Business School of Paris, Cergy, France 3 DEI, University of
    Bologna, Bologna, Italy
- id: J30
  title: A note on Selective line-graphs and partition colorings
  authors:
  - D. Cornaz
  - F. Furini
  - E. Malaguti
  - A. Santini
  year: 2019
  kind: journal
  venue: Operations Research Letters, Springer.
  doi: 10.1016/j.orl.2019.08.005
  themes:
  - graph-coloring
  folder: J30_2019_ORL_note-selective-line-graphs-partition-colorings
  code_url: null
  abstract: We extend a one-to-one correspondence between the set of all colorings of any graph and the
    set of all stable sets of an auxiliary graph, from graphs to partitioned graphs. This correspondence
    has an application to Selective Coloring and to Selective Max-Coloring. Selective/partition coloring
    Line graph Stable set Max-coloring
- id: J31
  title: A lexicographic pricer for the fractional bin packing problem
  authors:
  - S. Coniglio
  - F. D'Andreagiovanni
  - F. Furini
  year: 2019
  kind: journal
  venue: Operations Research Letters, Springer.
  doi: 10.1016/j.orl.2019.10.011
  themes:
  - bin-packing-cutting-stock
  folder: J31_2019_ORL_lexicographic-pricer-fractional-bin-packing
  code_url: null
  abstract: We propose an exact lexicographic dynamic programming pricing algorithm for solving the Fractional
    Bin Packing Problem with column generation. The new algorithm is designed for generating maximal columns
    of minimum reduced cost which maximize, lexicographically, one of the measures of maximality we investigate.
    Extensive computational experiments reveal that a column generation algorithm based on this pricing
    technique can achieve a substantial reduction in the number of columns and the computing time, also
    when combined with a classical smoothing technique from the literature. Fractional bin packing problem
    Column generation Dynamic programming Lexicographic optimization
- id: J32
  title: A branch-and-price algorithm for the temporal bin packing problem
  authors:
  - M. Dell'Amico
  - F. Furini
  - M. Iori
  year: 2020
  kind: journal
  venue: Computer & Operations Research, Elsevier.
  doi: 10.1016/j.cor.2019.104825
  themes:
  - bin-packing-cutting-stock
  folder: J32_2020_COR_branch-price-algorithm-temporal-bin-packing
  code_url: null
  abstract: We study an extension of the classical Bin Packing Problem, where each item consumes the bin
    capacity during a given time window that depends on the item itself. The problem asks for finding
    the minimum number of bins to pack all the items while respecting the bin capacity at any time instant.
    A polynomialsize formulation, an exponential-size formulation, and a number of lower and upper bounds
    are studied. A branch-and-price algorithm for solving the exponential-size formulation is introduced.
    An overall algorithm combining the different methods is then proposed and tested through extensive
    computational experiments
- id: J33
  title: A Branch-and-Price Framework for Decomposing Graphs into Relaxed Cliques
  authors:
  - T. Gschwind
  - S. Irnich
  - F. Furini
  - R. Wolfler Calvo
  year: 2021
  kind: journal
  venue: INFORMS Journal on Computing, INFORMS.
  doi: 10.1287/ijoc.2020.0984
  themes:
  - clique-stable-set
  folder: J33_2021_IJOC_branch-price-framework-decomposing-graphs-into
  code_url: null
  abstract: We study the family of problems of partitioning and covering a graph into/ with a minimum
    number of relaxed cliques. Relaxed cliques are subsets of vertices of a graph for which a clique-deﬁning
    property—for example, the degree of the vertices, the distance between the vertices, the density of
    the edges, or the connectivity between the vertices—is relaxed. These graph partitioning and covering
    problems have important applications in many areas such as social network analysis, biology, and disease-spread
    prevention. We propose a uniﬁed framework based on branch-and-price techniques to compute optimal
    decompositions. For this purpose, new, effective pricing algorithms are developed, and new branching
    schemes are invented. In extensive computational studies, we compare several algorithmic designs,
    such as structure-preserving versus dichotomous branching, and their interplay with different pricing
    algorithms. The ﬁnal chosen branch- and-price setup produces results that demonstrate the effectiveness
    of all components of the newly developed framework and the validity of our approach when applied to
    social network instances
- id: J34
  title: A new combinatorial branch-and-bound algorithm for the Knapsack Problem with Conflicts
  authors:
  - S. Coniglio
  - F. Furini
  - P. San Segundo
  year: 2021
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2020.07.023
  themes:
  - knapsack
  folder: J34_2021_EJOR_combinatorial-branch-bound-algorithm-knapsack-conflicts
  code_url: https://github.com/psanse/KPCG
  abstract: 'We study the Knapsack Problem with Conflicts, a generalization of the Knapsack Problem in
    which a set of conflicts specifies pairs of items which cannot be simultaneously selected. In this
    work, we propose a novel combinatorial branch-and-bound algorithm for this problem based on an n-ary
    branching scheme. Our algorithm effectively combines different procedures for pruning the branch-and-bound
    nodes based on different relaxations of the Knapsack Problem with Conflicts. Its main elements of
    novelty are: (i) the adoption of the branching-and-pruned set branching scheme which, while extensively
    used in the maximum-clique literature, was never successfully employed for solving the Knapsack Problem
    with Conflicts; (ii) the adoption of the Multiple-Choice Knapsack Problem for the derivation of upper
    bounds used for pruning the branch-and-bound tree nodes; and (iii) the design of a new upper bound
    for the latter problem which can be computed very eﬃciently. Key to our algorithm is its high pruning
    potential and the low computational effort that it requires to process each branch-and-bound node.
    An extensive set of experiments carried out on the benchmark instances typically used in the literature
    shows that, for edge densities ranging from 0.1 to 0.9, our algorithm is faster by up to two orders
    of magnitude than the state-of-the-art method and by up to several orders of magnitude than a state-of-the-art
    mixed-integer linear programming solver'
- id: J35
  title: A Branch-and-Price Algorithm for the Minimum Sum Coloring Problem
  authors:
  - D. Delle Donne
  - F. Furini
  - E. Malaguti
  - R. Wolfler Calvo
  year: 2021
  kind: journal
  venue: Discrete Applied Mathematics, Elsevier.
  doi: 10.1016/j.dam.2020.08.031
  themes:
  - graph-coloring
  folder: J35_2021_DAM_branch-price-algorithm-minimum-sum-coloring
  code_url: null
  abstract: 'A proper coloring of a given graph is an assignment of a positive integer number (color)
    to each vertex such that two adjacent vertices receive different colors. This paper studies the Minimum
    Sum Coloring Problem (MSCP), which asks for finding a proper coloring while minimizing the sum of
    the colors assigned to the vertices. We propose the first branch-and-price algorithm to solve the
    MSCP to proven optimality. The newly developed exact approach is based on an Integer Programming (IP)
    formulation with an exponential number of variables which is tackled by column generation. We present
    extensive computational experiments, on synthetic and benchmark DIMACS graphs from the literature,
    to compare the performance of our newly developed branch-and-price algorithm against three compact
    IP formulations. On synthetic graphs, our algorithm outperforms the compact formulations in terms
    of: (i) number of solved instances, (ii) running times and (iii) exit gaps obtained when optimality
    is not achieved. For the DIMACS instances, our algorithm is competitive with the best compact formulation
    and provides very strong dual bounds'
- id: J36
  title: Casting Light on the Hidden Bilevel Combinatorial Structure of the Capacitated Vertex Separator
    Problem
  authors:
  - F. Furini
  - I. Ljubić
  - E. Malaguti
  - P. Paronuzzi
  year: 2022
  kind: journal
  venue: Operations Research, INFORMS.
  doi: 10.1287/opre.2021.2110
  themes:
  - interdiction-blocker-vertex-cut
  folder: J36_2022_OPRE_casting-light-hidden-bilevel-combinatorial-structure
  code_url: null
  abstract: Given an undirected graph, we study the capacitated vertex separator problem that asks to
    ﬁnd a subset of vertices of minimum cardinality, the removal of which induces a graph having a bounded
    number of pairwise disconnected shores (subsets of vertices) of limited cardinality. The problem is
    of great importance in the analysis and protection of com- munication or social networks against possible
    viral attacks and for matrix decomposition al- gorithms. In this article, we provide a new bilevel
    interpretation of the problem and model it as a two-player Stackelberg game in which the leader interdicts
    the vertices (i.e., decides on the subset of vertices to remove), and the follower solves a combinatorial
    optimization prob- lem on the resulting graph. This approach allows us to develop a computational
    framework based on an integer programming formulation in the natural space of the variables. Thanks
    to this bilevel interpretation, we derive three different families of strengthening inequalities and
    show that they can be separated in polynomial time. We also show how to extend these results to a
    min-max version of the problem. Our extensive computational study conducted on available benchmark
    instances from the literature reveals that our new exact method is competitive against the state-of-the-art
    algorithms for the capacitated vertex separator prob- lem and is able to improve the best-known results
    for several difﬁcult classes of instances. The ideas exploited in our framework can also be extended
    to other vertex/edge deletion/ insertion problems or graph partitioning problems by modeling them
    as two-player Stackel- berg games and solving them through bilevel optimization
- id: J37
  title: A branch-and-cut algorithm for the Edge Interdiction Clique Problem
  authors:
  - F. Furini
  - I. Ljubic
  - P. San Segundo
  - Y. Zhao
  year: 2021
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2021.01.030
  themes:
  - interdiction-blocker-vertex-cut
  folder: J37_2021_EJOR_branch-cut-algorithm-edge-interdiction-clique
  code_url: null
  abstract: Given a graph G and an interdiction budget k ∈ N, the Edge Interdiction Clique Problem (EICP)
    asks to find a subset of at most k edges to remove from G so that the size of the maximum clique,
    in the interdicted graph, is minimized. The EICP belongs to the family of interdiction problems with
    the aim of reducing the clique number of the graph. The EICP optimal solutions, called optimal interdiction
    policies, determine the subset of most vital edges of a graph which are crucial for preserving its
    clique number. We propose a new set-covering-based Integer Linear Programming (ILP) formulation for
    the EICP with an exponential number of constraints, called the clique-covering inequalities. We design
    a new branch-and-cut algorithm which is enhanced by a tailored separation procedure and by an effective
    heuristic initialization phase. Thanks to the new exact algorithm, we manage to solve the EICP in
    several sets of instances from the literature. Extensive tests show that the new exact algorithm greatly
    outperforms the state-of-the-art approaches for the EICP
- id: J38
  title: On the exact separation of cover inequalities of maximum-depth
  authors:
  - D. Catanzaro
  - S. Coniglio
  - F. Furini
  year: 2022
  kind: journal
  venue: Optimization Letters, Springer.
  doi: 10.1007/s11590-021-01741-0
  themes:
  - knapsack
  folder: J38_2022_OPTLETT_exact-separation-cover-inequalities-maximum-depth
  code_url: https://github.com/fabiofurini/COVER_MAX_DEPTH
  abstract: We investigate the problem of separating cover inequalities of maximum-depth exactly. We propose
    a pseudopolynomial-time dynamic-programming algorithm for its solu- tion, thanks to which we show
    that this problem is weakly N P-hard (similarly to the problem of separating cover inequalities of
    maximum violation). We carry out extensive computational experiments on instances of the knapsack
    and the multi- dimensional knapsack problems with and without conflict constraints. The results show
    that, with a cutting-plane generation method based on the maximum-depth cri- terion, we can optimize
    over the cover-inequality closure by generating a number of cuts smaller than when adopting the standard
    maximum-violation criterion. We also introduce the Point-to-Hyperplane Distance Knapsack Problem (PHD-KP),
    a problem closely related to the separation problem for maximum-depth cover inequalities, and show
    how the proposed dynamic programming algorithm can be adapted for effec- tively solving the PHD-KP
    as well
- id: J39
  title: A new branch-and-filter exact algorithm for binary constraint satisfaction problems
  authors:
  - P. San Segundo
  - F. Furini
  - R. Le\'on
  year: 2022
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2021.09.014
  themes: []
  folder: J39_2022_EJOR_branch-filter-exact-algorithm-binary-constraint
  code_url: https://github.com/psanse/Bfilt
  abstract: A binary constraint satisfaction problem (BCSP) consists in determining an assignment of values
    to variables that is compatible with a set of constraints. The problem is called binary because the
    constraints involve only pairs of variables. The BCSP is a cornerstone problem in Constraint Programming
    (CP), appearing in a very wide range of real-world applications. In this work, we develop a new exact
    algorithm which effectively solves the BCSP by reformulating it as a k-clique problem on the underlying
    microstructure graph representation. Our new algorithm exploits the cutting-edge branching scheme
    of the stateof-the-art maximum clique algorithms combined with two filtering phases in which the domains
    of the variables are reduced. Our filtering phases are based on colouring techniques and on heuristically
    solving an associated boolean satisfiability (SAT) problem. In addition, the algorithm initialization
    phase performs a reordering of the microstructure graph vertices that produces an often easier reformulation
    to solve. We carry out an extensive computational campaign on a benchmark of almost 20 0 0 instances,
    encompassing numerous real and synthetic problems from the literature. The performance of the new
    algorithm is compared against four SAT-based solvers and three general purpose CP solvers. Our tests
    reveal that the new algorithm significantly outperforms all the others in several classes of BCSP
    instances
- id: J40
  title: Variable and constraint reduction techniques for the temporal bin packing problem with fire-ups
  authors:
  - J. Martinovic
  - N. Strasdat
  - J. Valerio de Carvalho
  - F. Furini
  year: 2022
  kind: journal
  venue: Optimization Letters, Springer.
  doi: 10.1007/s11590-021-01825-x
  themes:
  - bin-packing-cutting-stock
  folder: J40_2022_OPTLETT_variable-constraint-reduction-techniques-temporal-bin
  code_url: null
  abstract: The aim of this letter is to design and computationally test several improvements for the
    compact integer linear programming (ILP) formulations of the temporal bin packing problem with fire-ups
    (TBPP-FU). This problem is a challenging generalization of the classical bin packing problem in which
    the items, interpreted as jobs of given weight, are active only during an associated time window.
    The TBPP-FU objective function asks for the minimization of the weighted sum of the number of bins,
    viewed as servers of given capacity, to execute all the jobs and the total number of fire-ups. The
    fire-ups count the number of times the servers are activated due to the presence of assigned active
    jobs. Our contributions are effective procedures to reduce the number of variables and constraints
    of the ILP formulations proposed in the literature as well as the introduction of new valid inequalities.
    By extensive computational tests we show that substantial improvements can be achieved and several
    instances from the literature can be solved to proven optimality for the first time
- id: J41
  title: Submodular maximization of concave utility functions composed with a set-union operator with
    applications to maximal covering location problems
  authors:
  - S. Coniglio
  - F. Furini
  - I. Ljubic
  year: 2022
  kind: journal
  venue: Mathematical Programming, Springer.
  doi: 10.1007/s10107-022-01884-7
  themes:
  - covering-location-submodular
  folder: J41_2022_MATHPROG_submodular-maximization-concave-utility-functions-composed
  code_url: https://github.com/fabiofurini/Maximizing-submodular-utility-functions
  abstract: 'We study a family of discrete optimization problems asking for the maximization of the expected
    value of a concave, strictly increasing, and differentiable function com- posed with a set-union operator.
    The expected value is computed with respect to a set of coefficients taking values from a discrete
    set of scenarios. The function models the utility function of the decision maker, while the set-union
    operator models a cover- ing relationship between two ground sets, a set of items and a set of metaitems.
    This problem generalizes the problem introduced by Ahmed S, Atamtürk A (Mathematical programming 128(1-2):149–169,
    2011), and it can be modeled as a mixed integer nonlinear program involving binary decision variables
    associated with the items and metaitems. Its goal is to find a subset of metaitems that maximizes
    the total utility corresponding to the items it covers. It has applications to, among others, maximal
    covering location, and influence maximization problems. In the paper, we propose a double-hypograph
    decomposition which allows for projecting out the variables asso- ciated with the items by separately
    exploiting the structural properties of the utility function and of the set-union operator. Thanks
    to it, the utility function is linearized via an exact outer-approximation technique, whereas the
    set-union operator is linearized B Stefano Coniglio s.coniglio@soton.ac.uk; stefano.coniglio@unibg.it
    Fabio Furini fabio.furini@uniroma1.it Ivana Ljubić ivana.ljubic@essec.edu 1 Mathematical Sciences,
    University of Southampton, Southampton, UK 2 Department of Economics, University of Bergamo, Bergamo,
    Italy 3 Department of Computer, Control and Management Engineering “Antonio Ruberti”, Sapienza University
    of Rome, Rome, Italy 4 Information Systems, Decision Sciences and Statistics Department, ESSEC Business
    School of Paris, Cergy-Pontoise, France in two ways: either (i) via a reformulation based on submodular
    cuts, or (ii) via a Benders decomposition. We analyze from a theoretical perspective the strength
    of the inequalities of the resulting reformulations, and embed them into two branch-and-cut algorithms.
    We also show how to extend our reformulations to the case where the utility function is not necessarily
    increasing. We then experimentally compare our algorithms inter se, to a standard reformulation based
    on submodular cuts, to a state- of-the-art global-optimization solver, and to the greedy algorithm
    for the maximization of a submodular function. The results reveal that, on our testbed, the method
    based on combining an outer approximation with Benders cuts significantly outperforms the other ones'
