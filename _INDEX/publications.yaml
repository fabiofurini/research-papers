- id: J08
  title: Heuristic and exact algorithms for the interval min-max regret knapsack problem
  authors:
  - F. Furini
  - M. Iori
  - S. Martello
  - M. Yagiura
  year: 2015
  kind: journal
  venue: INFORMS Journal on Computing, INFORMS.
  doi: 10.1287/ijoc.2014.0632
  themes:
  - knapsack
  folder: J08_2015_IJOC_heuristic-exact-algorithms-interval-min-max
  code_url: null
  abstract: We consider a generalization of the 0-1 knapsack problem in which the profit of each item
    can take any value in a range characterized by a minimum and a maximum possible profit. A set of specific
    profits is called a scenario. Each feasible solution associated with a scenario has a regret, given
    by the difference between the optimal solution value for such scenario and the value of the considered
    solution. The interval min-max regret knapsack problem (MRKP) is then to find a feasible solution
    such that the maximum regret over all scenarios is minimized. The problem is extremely challenging
    both from a theoretical and a practical point of view. Its decision version is complete for the complexity
    class $^p_2$ hence it is most probably not in $NP$. In addition, even computing the regret of a solution
    with respect to a scenario requires the solution of an $NP$-hard problem. We examine the behavior
    of classical combinatorial optimization approaches when adapted to the solution of the MRKP. We introduce
    an iterated local search approach and a Lagrangian-based branch-and-cut algorithm, and evaluate their
    performance through extensive computational experiments.
- id: J09
  title: Approaches to a real-world train timetabling problem in a railway node
  authors:
  - V. Cacchiani
  - F. Furini and M. P. Kidd
  year: 2016
  kind: journal
  venue: Omega, Elsevier.
  doi: 10.1016/j.omega.2015.04.006
  themes:
  - transportation-scheduling
  folder: J09_2016_OMEGA_approaches-real-world-train-timetabling-railway
  code_url: null
  abstract: We consider the Train Timetabling Problem (TTP) in a railway node (i.e. a set of stations
    in an urban area interconnected by tracks), which calls for determining the best schedule for a given
    set of trains during a given time horizon, while satisfying several track operational constraints.
    In particular, we consider the context of a highly congested railway node in which different Train
    Operators wish to run trains according to timetables that they propose, called ideal timetables. The
    ideal timetables altogether may be (and usually are) conflicting, i.e. they do not respect one or
    more of the track operational constraints. The goal is to determine conflict-free timetables that
    differ as little as possible from the ideal ones. The problem was studied for a research project funded
    by Rete Ferroviaria Italiana (RFI), the main Italian railway Infrastructure Manager, who also provided
    us with real-world instances. We present an Integer Linear Programming (ILP) model for the problem,
    which adapts previous ILP models from the literature to deal with the case of a railway node. The
    Linear Programming (LP) relaxation of the model is used to derive a dual bound. In addition, we propose
    an iterative heuristic algorithm that is able to obtain good solutions to real-world instances with
    up to 1500 trains in short computing times. The proposed algorithm is also used to evaluate the capacity
    saturation of the railway nodes
- id: J10
  title: Solving the Temporal Knapsack Problem via Recursive Dantzig–Wolfe Reformulation
  authors:
  - A. Caprara
  - F. Furini
  - E. Malaguti
  - E. Traversi
  year: 2016
  kind: journal
  venue: Information Processing Letters, Elsevier.
  doi: 10.1016/j.ipl.2016.01.008
  themes:
  - knapsack
  folder: J10_2016_IPL_solving-temporal-knapsack-recursive-dantzigwolfe-reformulation
  code_url: null
  abstract: The Temporal Knapsack Problem (TKP) is a generalization of the standard Knapsack Problem where
    a time horizon is considered, and each item consumes the knapsack capacity during a limited time interval
    only. In this paper we solve the TKP using what we call a Recursive Dantzig–Wolfe Reformulation (DWR)
    method. The generic idea of Recursive DWR is to solve a Mixed Integer Program (MIP) by recursively
    applying DWR, i.e., by using DWR not only for solving the original MIP but also for recursively solving
    the pricing subproblems. In a binary case (like the TKP), the Recursive DWR method can be performed
    in such a way that the only two components needed during the optimization are a Linear Programming
    solver and an algorithm for solving Knapsack Problems. The Recursive DWR allows us to solve Temporal
    Knapsack Problem instances through computation of strong dual bounds, which could not be obtained
    by exploiting the best-known previous approach based on DWR
- id: J11
  title: Approximated Projected Perspective Relaxations
  authors:
  - A. Frangioni
  - F. Furini
  - C. Gentile
  year: 2016
  kind: journal
  venue: Computational Optimization and Applications, Springer.
  doi: 10.1007/s10589-015-9787-8
  themes:
  - decomposition-reformulation
  folder: J11_2016_COAP_approximated-projected-perspective-relaxations
  code_url: null
  abstract: The perspective reformulation (PR) of a Mixed-Integer NonLinear Program with semi-continuous
    variables is obtained by replacing each term in the (separable) objective function with its convex
    envelope. Solving the corresponding continuous relaxation requires appropriate techniques. Under some
    rather restrictive assumptions, the Projected PR (P2 R) can be defined where the integer variables
    are eliminated by projecting the solution set onto the space of the continuous variables only. This
    approach produces a simple piecewise-convex problem with the same structure as the original one; however,
    this prevents the use of general-purpose solvers, in that some variables are then only implicitly
    represented in the formulation. We show how to construct an Approximated Projected PR (AP2 R) whereby
    the projected formulation is “lifted” back to the original variable space, with each integer variable
    expressing one piece of the obtained piecewise-convex function. In some cases, this produces a reformulation
    of the original problem with exactly the same size and structure as the standard continuous relaxation,
    but providing substantially improved bounds. In the process we also substantially extend the approach
    beyond the original P2 R develop- B Antonio Frangioni frangio@di.unipi.it Fabio Furini fabio.furini@dauphine.fr
    Claudio Gentile gentile@iasi.cnr.it 1 Dipartimento di Informatica, Università di Pisa, Largo B. Pontecorvo
    3, 56127 Pisa, Italy 2 LAMSADE, Université Paris-Dauphine, Place du Maréchal de Lattre de Tassigny,
    75775 Paris, France 3 Istituto di Analisi dei Sistemi ed Informatica “A. Ruberti” (IASI-CNR), Consiglio
    Nazionale delle Ricerche, Viale Manzoni 30, Rome, Italy ment by relaxing the requirement that the
    objective function be quadratic and the left endpoint of the domain of the variables be non-negative.
    While the AP2 R bound can be weaker than that of the PR, this approach can be applied in many more
    cases and allows direct use of off-the-shelf MINLP software; this is shown to be competitive with
    previously proposed approaches in some applications
- id: J12
  title: Modeling Two-Dimensional Guillotine Cutting Problems via Integer Programming
  authors:
  - F. Furini
  - E. Malaguti
  - D. Thomopulos
  year: 2016
  kind: journal
  venue: INFORMS Journal on Computing, INFORMS.
  doi: 10.1287/ijoc.2016.0710
  themes:
  - bin-packing-cutting-stock
  folder: J12_2016_IJOC_modeling-two-dimensional-guillotine-cutting-integer
  code_url: null
  abstract: We propose a framework to model general guillotine restrictions in two-dimensional cutting
    problems formulated as Mixed-Integer Linear Programs (MIP). The modeling framework requires a pseudo-polynomial
    number of variables and constraints, which can be effectively enumerated for medium-size instances.
    Our modeling of general guillotine cuts is the first one that, once it is implemented within a state-of-the-art
    MIP solver, can tackle instances of challenging size. We mainly concentrate our analysis on the Guillotine
    Two Dimensional Knapsack Problem (G2KP), for which a model, and an exact procedure able to significantly
    improve the computational performance, are given. We also show how the modeling of general guillotine
    cuts can be extended to other relevant problems such as the Guillotine Two Dimensional Cutting Stock
    Problem (G2CSP) and the Guillotine Strip Packing Problem (GSPP). Finally, we conclude the paper discussing
    an extensive set of computational experiments on G2KP and GSPP benchmark instances from the literature.
- id: J13
  title: The Time Dependent Traveling Salesman Planning Problem in Controlled Airspace
  authors:
  - F. Furini
  - C.A. Persiani
  - P. Toth
  year: 2016
  kind: journal
  venue: Transportation Research Part B, Elsevier.
  doi: 10.1016/j.trb.2016.04.009
  themes:
  - transportation-scheduling
  folder: J13_2016_TRB_time-dependent-traveling-salesman-planning-controlled
  code_url: null
  abstract: The integration of drones into civil airspace is one of the most challenging problems for
    the automation of the controlled airspace, and the optimization of the drone route is a key step for
    this process. In this paper, we optimize the route planning of a drone mission that consists of departing
    from an airport, flying over a set of mission way points and coming back to the initial airport. We
    assume that during the mission a set of piloted aircraft flies in the same airspace and thus the cost
    of the drone route depends on the air traﬃc and on the avoidance maneuvers used to prevent possible
    conflicts. Two air traffic management techniques, i.e., routing and holding, are modeled in order
    to maintain a minimum separation between the drone and the piloted aircraft. The considered problem,
    called the Time Dependent Traveling Salesman Planning Problem in Controlled Airspace (TDTSPPCA), relates
    to the drone route planning phase and aims to minimize the total operational cost. Two heuristic algorithms
    are proposed for the solution of the problem. A mathematical formulation based on a particular version
    of the Time Dependent Traveling Salesman Problem, which allows holdings at mission way points, and
    a Branch and Cut algorithm are proposed for solving the TDTSPPCA to optimality. An additional formulation,
    based on a Travelling Salesman Problem variant that uses specific penalties to model the holding times,
    is proposed and a Cutting Plane algorithm is designed. Finally, computational experiments on real-world
    air traﬃc data from Milano Linate Terminal Maneuvering Area are reported to evaluate the performance
    of the proposed formulations and of the heuristic algorithms
