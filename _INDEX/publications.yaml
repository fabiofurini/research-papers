- id: J47
  title: An Exact Approach for the Train Single-Routing Selection Problem
  authors:
  - A.L. Croella
  - F. Furini
  - I. Ljubic
  - B. Pascariu
  - P. Pellegrini
  - P. San Segundo
  year: 2026
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2026.08.028
  themes:
  - transportation-scheduling
  folder: J47_2026_EJOR_exact-approach-train-single-routing-selection
  code_url: null
  abstract: 'Keywords: Given a set of train routes with route costs and a set of compatible route pairs
    with pairing costs, the Train Transportation Single-Routing Selection Problem (TSRSP) seeks to assign
    one route to each train, minimizing the total cost Combinatorial optimization while ensuring pairwise
    compatibility among the selected routes. This problem is of significant practical Binary Quadratic
    Programming relevance in rail traffic management and it is a special case of the Train Routing Selection
    Problem. We Linearization techniques introduce a Binary Quadratic Programming formulation for the
    TSRSP and apply a linearization technique Integer Linear Programming from the literature that requires
    a linear number of additional variables and constraints. This yields a novel and effective Mixed Integer
    Linear Programming (MILP) formulation for the TSRSP. By exploiting the structure of the problem, we
    further propose a method to strengthen the Linear Programming (LP) relaxation of the MILP formulation,
    substantially improving its computational performance. The resulting formulation is the first to efficiently
    solve real-world TSRSP instances to optimality within short computational times— instances that, until
    now, have only been addressed using heuristic approaches in the literature. Extensive computational
    results show that our MILP model consistently outperforms existing formulations, both in terms of
    computational time and the number of instances solved to optimality, primarily due to the strength
    of its LP relaxation'
- id: J48
  title: Strength of the Upper Bounds for the Edge-Weighted Maximum Clique Problem
  authors:
  - F. Ciccarelli
  - V. Dose
  - F. Furini
  - M. Monaci
  year: 2026
  kind: journal
  venue: Discrete Applied Mathematics, Elsevier.
  doi: 10.1016/j.dam.2026.09.019
  themes:
  - clique-stable-set
  folder: J48_2026_DAM_strength-upper-bounds-edge-weighted-maximum
  code_url: null
  abstract: 'We theoretically and computationally compare the strength of the three main upper bounds
    from the literature on the optimal value of the Edge-Weighted Maximum Clique Problem (EWMCP). We provide
    a set of instances for which the ratio between any of the three upper bounds and the optimal value
    of the EWMCP is unbounded, showing that none of them can give a performance guarantee. We further
    analyze the relative strength among the three upper bounds by determining, for every choice of a ratio
    between any two of them, the largest values it can attain and providing families of instances for
    which such values can be reached. Our results show that, for each pair of upper bounds, there exist
    appropriately chosen instances on which either bound is tighter than the other. Our theoretical analysis
    is complemented by extensive computational experiments on two benchmark datasets: the standard DIMACS
    instances and randomly generated instances, providing practical insights into the empirical strength
    of the upper bounds'
- id: C01
  title: Partial convexification of general MIPs by Dantzig-Wolfe reformulation
  authors:
  - M. Bergner
  - A. Caprara
  - F. Furini
  - M.E. Lübbecke
  - E. Malaguti
  - E. Traversi
  year: 2011
  kind: conference
  venue: 15th International Conference on Integer Programming and Combinatorial Optimization (IPCO 2011),
    New York, USA, June 2011 (12 pages).
  doi: 10.1007/978-3-642-20807-2_4
  themes: []
  folder: C01_2011_IPCO_partial-convexification-general-mips-by-dantzig
  code_url: null
  abstract: 'Dantzig-Wolfe decomposition is well-known to provide strong dual bounds for specially structured
    mixed integer programs (MIPs) in practice. However, the method is not implemented in any state-of-the-art
    MIP solver: it needs tailoring to the particular problem; the decomposi- tion must be determined from
    the typical bordered block-diagonal matrix structure; the resulting column generation subproblems
    must be solved eﬃciently; etc. We provide a computational proof-of-concept that the process can be
    automated in principle, and that strong dual bounds can be obtained on general MIPs for which a solution
    by a decomposition has not been the ﬁrst choice. We perform an extensive computational study on the
    0-1 dynamic knapsack problem (without block-diagonal structure) and on general MIPLIB2003 instances.
    Our results support that Dantzig-Wolfe reformulation may hold more promise as a general- purpose tool
    than previously acknowledged by the research community'
- id: C02
  title: Aircraft Sequencing Problems via a Rolling Horizon Algorithm
  authors:
  - F. Furini
  - C. Persiani
  - P. Toth
  year: 2012
  kind: conference
  venue: 3rd International Symposium on Combinatorial Optimization (ISCO 2012), Athens, Greece, April
    2012 (12 pages).
  doi: 10.1007/978-3-642-32147-4_25
  themes: []
  folder: C02_2012_ISCO_aircraft-sequencing-rolling-horizon-algorithm
  code_url: null
  abstract: Aircraft sequencing on the runway is a challenging optimiza- tion problem that aims to reduce
    the delays and the air traﬃc controllers workload in a scenario characterized by a continuous growth
    of the air transportation demand. In this paper we consider the problem of se- quencing both arrivals
    and departures on a single runway airport. We formalize the problem using a Mixed Integer Programming
    Model and we propose a rolling horizon solution approach. Computational results on real-world air
    traﬃc instances from the Milano Linate Airport are reported. The results show that the proposed approach
    is able to signif- icantly improve on the First Come First Served (FCFS) sequence
- id: C03
  title: Hybrid SDP Bounding Procedure
  authors:
  - F. Furini
  - E. Traversi
  year: 2013
  kind: conference
  venue: 12th International Symposium on Experimental Algorithms (SEA 2013), Rome, Italy, June 2013 (12
    pages).
  doi: 10.1007/978-3-642-38527-8_23
  themes: []
  folder: C03_2013_SEA_hybrid-sdp-bounding-procedure
  code_url: null
  abstract: The principal idea of this paper is to exploit Semideﬁnite Programming (SDP) relaxation within
    the framework provided by Mixed Integer Nonlinear Programming (MINLP) solvers when tackling Binary
    Quadratic Problems. We included the SDP relaxation in a state-of-the- art MINLP solver as an additional
    bounding technique and demonstrated that this idea could be computationally useful. The Quadratic
    Stable Set Problem is adopted as the case study. The tests indicate that the Hy- brid SDP Bounding
    Procedure allows an average 50% cut of the overall computing time and a cut of more than one order
    of magnitude for the branching nodes
- id: C04
  title: A fast heuristic approach for train timetabling in a railway node
  authors:
  - F. Furini
  - M. P. Kidd
  year: 2013
  kind: conference
  venue: 6th International Network Optimization Conference (INOC 2013), Tenerife, Spain, May 2013 (8 pages).
  doi: 10.1016/j.endm.2013.05.094
  themes: []
  folder: C04_2013_INOC_fast-heuristic-approach-train-timetabling-railway
  code_url: null
  abstract: We consider a conﬂict-free scheduling problem which arises in railway networks, where ideal
    timetables have been provided for a set of trains, but where these timetables may be conﬂicting. We
    use a space-time graph approach from the railway scheduling literature in order to develop a fast
    heuristic which resolves conﬂicts by adjusting the ideal timetables while attempting to minimize the
    deviation from the ideal timetable. Our approach is tested on realistic data obtained from the railway
    node of Milan
- id: C05
  title: State space reduced dynamic programming for the aircraft sequencing problem with constrained
    position shifting
  authors:
  - F. Furini
  - M. P. Kidd
  - A. Persiani
  - P. Toth
  year: 2014
  kind: conference
  venue: 4th International Symposium on Combinatorial Optimization (ISCO 2014), Lisbon, Portugal, March
    2014 (12 pages).
  doi: 10.1007/978-3-319-09174-7_23
  themes: []
  folder: C05_2014_ISCO_state-space-reduced-dynamic-programming-aircraft
  code_url: null
  abstract: In this paper we present state space reduction techniques for a dynamic programming algorithm
    applied to the Aircraft Sequencing Problem (ASP) with Constrained Position Shifting (CPS). We consider
    the classical version of the ASP, which calls for determining the order in which a given set of aircraft
    should be assigned to a runway at an airport, subject to minimum separations in time between consecutive
    aircraft, in order to minimize the sum of the weighted deviations from the scheduled arrival/departure
    times of the aircraft. The focus of the paper is on a number of ways of improving the computation
    times of the dynamic programming algorithm proposed. This is achieved by using heuristic upper bounds
    and a completion lower bound in order to reduce the state space in the dynamic programming algorithm.
    We compare our algorithm to an approach based on mixed integer linear programming, which was adapted
    from the literature for the case of CPS. We show using real-world air traﬃc instances from the Milan
    Linate Airport that the dynamic programming algorithm signiﬁcantly outperforms the MILP. Furthermore,
    we show that the proposed algorithm is capable of solving very large instances in short computation
    times, and that it is suitable for use in a real-time setting
