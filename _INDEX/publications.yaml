- id: J06
  title: Automatic Dantzig-Wolfe Reformulation of Mixed Integer Programs
  authors:
  - M. Bergner
  - A. Caprara
  - A. Ceselli
  - F. Furini
  - M. E. Lübbecke
  - E. Malaguti
  - E. Traversi
