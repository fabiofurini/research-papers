- id: C07
  title: ILP and CP Formulations for the Lazy Bureaucrat Problem
  authors:
  - I. Ljubic
  - F. Furini
  - M. Sinnl
  year: 2015
  kind: conference
  venue: 12th International Conference on Integration of Artificial Intelligence and Operations Research
    Techniques in Constraint Programming (CPAIOR 2015), Barcelona, Spain, May 2015 (15 pages).
  doi: 10.1007/978-3-319-18008-3_18
  themes: []
  folder: C07_2015_CPAIOR_ilp-cp-formulations-lazy-bureaucrat
  code_url: null
  abstract: Lazy reformulations of classical combinatorial optimization problems are new and challenging
    classes of problems. In this paper we focus on the Lazy Bureaucrat Problem (LBP) which is the lazy
    coun- terpart of the knapsack problem. Given a set of tasks with a common arrival time and deadline,
    the goal of a lazy bureaucrat is to schedule a least proﬁtable subset of tasks, while having an excuse
    that no other tasks can be scheduled without exceeding the deadline. Three ILP formulations and their
    CP counterparts are studied and implemented. In addition, a dynamic programming algorithm that runs
    is pseudo-polynomial time and polynomial greedy heuristics are imple- mented and computationally compared
    with ILP/CP approaches. For the computational study, a large set of knapsack-type instances with various
    characteristics is used to examine the applicability and strength of the proposed approaches
- id: C08
  title: Lower Bounding Techniques for DSATUR-based Branch and Bound
  authors:
  - F. Furini
  - V. Gabrel
  - I. C. Ternier
  year: 2015
  kind: conference
  venue: 7th International Network Optimization Conference (INOC 2015), Warsaw, Poland, June 2015 (8 pages).
  doi: 10.1016/j.endm.2016.03.020
  themes: []
  folder: C08_2015_INOC_lower-bounding-techniques-dsatur-based-branch
  code_url: null
  abstract: Given an undirected graph, the Vertex Coloring Problem (VCP) consists of assigning a color
    to each vertex of the graph such that two adjacent vertices do not share the same color and the total
    number of colors is minimized. DSATUR-based Branch- and-Bound is a well-known exact algorithm for
    the VCP. One of its main drawbacks is that a lower bound (equal to the size of a maximal clique) is
    computed once at the root of the branching scheme and it is never updated during the execution of
    the algorithm. In this article, we show how to update the lower bound and we compare the eﬃciency
    of several lower bounding techniques
- id: C09
  title: Matheuristics for the Temporal Bin Packing Problem
  authors:
  - F. Furini and X. Shen
  year: 2015
  kind: conference
  venue: 11th Metaheuristics International Conference (MIC 2015), Agadir, Morocco, June 2015 (13 pages).
  doi: 10.1007/978-3-319-58253-5_19
  themes: []
  folder: C09_2015_MIC_matheuristics-temporal-bin-packing
  code_url: null
  abstract: A rich lot-sizing problem is studied in this manuscript which comes from a real-world application.
    Our new lot-sizing problem com- bines several features, i.e., parallel machines, production time windows,
    backlogging, lost sale and setup carryover. Three mixed integer program- ming formulations are proposed.
    We theoretically and computationally compare these diﬀerent formulations, testing them on real-world
    and randomly generated instances. Our study is the ﬁrst step for eﬃciently tackling and solving this
    challenging real-world lot-sizing problem
- id: C10
  title: MIP Formulations for a Rich Real-world Lot-sizing Problem with Setup Carryover
  authors:
  - F. Focacci
  - F. Furini
  - V. Gabrel
  - D. Godard and X. Shen
  year: 2016
  kind: conference
  venue: 5th International Symposium on Combinatorial Optimization (ISCO 2016), Vietri sul Mare, Italy,
    May 2016 (12 pages).
  doi: 10.1007/978-3-319-45587-7_11
  themes: []
  folder: C10_2016_ISCO_mip-formulations-rich-real-world-lot
  code_url: null
  abstract: We study an extension of the Bin Packing Problem, where items consume the bin capacity during
    a time window only. The problem asks for finding the mini- mum number of bins to pack all the items
    respecting the bin capacity at any instant of time. Both a polynomial-size formulation and an extensive
    formulation are stud- ied. Moreover, various heuristic algorithms are developed and compared, including
    greedy heuristics and a column generation based heuristic. We perform extensive computational experiments
    on benchmark instances to evaluate the quality of the computed solutions with respect to strong bounds
    based on the linear programming relaxation of the proposed formulations
- id: C11
  title: ILP Models and Column Generation for the Minimum Sum Coloring Problem
  authors:
  - F. Furini
  - E. Malaguti
  - S. Martin and I.-C. Ternier
  year: 2017
  kind: conference
  venue: 8th International Network Optimization Conference (INOC 2017), Lisbon, Portugal, February 2017
    (10 pages).
  doi: 10.1016/j.endm.2018.01.023
  themes: []
  folder: C11_2017_INOC_ilp-models-column-generation-minimum-sum
  code_url: null
  abstract: We study two Integer Linear Programming (ILP) formulations for the Minimum Sum Coloring Problem
    (MSCP). The problem is an extension of the classical Ver- tex Coloring Problem in which each color
    is represented by a positive natural num- ber. The MSCP asks to minimize the sum of the cardinality
    of subsets of vertices receiving the same color, weighted by the index of the color, while ensuring
    that vertices linked by an edge receive diﬀerent colors. The ﬁrst ILP formulation has a polynomial
    number of variables while the second one has an exponential number of variables and is tackled via
    column generation. Computational tests show that the linear programming relaxation of the second formulation
    provides tight lower bounds which allow us to solve to proven optimality some hard instances of the
    literature
