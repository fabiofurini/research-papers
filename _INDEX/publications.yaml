- id: J43
  title: 'CliSAT: a new exact algorithm for hard maximum clique problems'
  authors:
  - P. San Segundo
  - F. Furini
  - D. Alvarez
  - P. Pardalos
  year: 2023
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.1016/j.ejor.2022.10.028
  themes:
  - clique-stable-set
  folder: J43_2023_EJOR_clisat-exact-algorithm-hard-maximum-clique
  code_url: https://github.com/psanse/CliSAT
  abstract: Given a graph, the maximum clique problem (MCP) asks for determining a complete subgraph with
    the largest possible number of vertices. We propose a new exact algorithm, called CliSAT, to solve
    the MCP to proven optimality. This problem is of fundamental importance in graph theory and combinatorial
    optimization due to its practical relevance for a wide range of applications. The newly developed
    exact approach is a combinatorial branch-and-bound algorithm that exploits the state-of-the-art branching
    scheme enhanced by two new bounding techniques with the goal of reducing the branching tree. The first
    one is based on graph colouring procedures and partial maximum satisfiability problems arising in
    the branching scheme. The second one is a filtering phase based on constraint programming and domain
    propagation techniques. CliSAT is designed for structured MCP instances which are computationally
    diﬃcult to solve since they are dense and contain many interconnected large cliques. Extensive experiments
    on hard benchmark instances, as well as new hard instances arising from different applications, show
    that CliSAT outperforms the state-of-the-art MCP algorithms, in some cases by several orders of magnitude
- id: J44
  title: A Numerically Exact Algorithm for the Bin-Packing Problem
  authors:
  - R. Baldacci
  - S. Coniglio
  - F. Furini
  year: 2024
  kind: journal
  venue: INFORMS Journal on Computing, INFORMS.
  doi: 10.1287/ijoc.2022.0257
  themes:
  - bin-packing-cutting-stock
  folder: J44_2024_IJOC_numerically-exact-algorithm-bin-packing
  code_url: https://github.com/fabiofurini/bpp-numerically-exact
  abstract: We propose a numerically exact algorithm for solving the Bin-Packing Problem (BPP) based on
    a branch-price-and-cut framework combined with a pattern-enumeration method. Key to the algorithm
    is a novel technique for the computation of numerically safe dual bounds for the widely adopted set
    covering reformulation of the BPP (tightened with additional valid inequalities) with a precision
    that is higher than the one of general- purpose oating-point solvers. Our branch-price-and-cut algorithm
    also relies on an exact integer ( xed-point) label setting algorithm for solving the pricing problem
    associated with the tightened set-covering formulation. To the best of our knowledge, ours is the
    rst algo- rithm for the BPP that is numerically exact and practical for solving large-scale instances.
    Extensive computational results on instances affected by notorious numerical dif culties fi (those
    of the Augmented Non-IRUP class) show that our exact algorithm outperforms all of the not numerically
    exact state-of-the-art algorithms based on branch-and-cut-and-price techniques that rely on a set-covering
    formulation of the BPP
- id: J45
  title: Integer linear programming formulations for the maximum flow blocker problem
  authors:
  - I. Bentoumi
  - F. Furini
  - A.R. Mahjoub
  - S. Martin
  year: 2025
  kind: journal
  venue: European Journal of Operational Research, Elsevier.
  doi: 10.2139/ssrn.4494082
  themes:
  - interdiction-blocker-vertex-cut
  folder: J45_2025_EJOR_integer-linear-programming-formulations-maximum-flow
  code_url: null
  abstract: Given a network with capacities and blocker costs associated with its arcs, we study the maximum
    flow blocker problem (FB). This problem seeks to identify a minimum-cost subset of arcs to be removed
    from the network, ensuring that the maximum flow value from the source to the destination in the remaining
    network does not exceed a specified threshold. The FB finds applications in telecommunication networks
    and monitoring of civil infrastructures, among other domains. We undertake a comprehensive study of
    several new integer linear programming (ILP) formulations designed for the FB. The first type of model,
    featuring an exponential number of constraints, is solved through tailored Branch-and-Cut algorithms.
    In contrast, the second type of ILP model, with a polynomial number of variables and constraints,
    is solved using a state-of-the-art ILP solver. The latter formulation establishes a structural connection
    between the FB and the maximum flow interdiction problem (FI), introducing a novel approach to obtaining
    solutions for each problem from the other. The ILP formulations proposed for solving the FB are evaluated
    thanks to a theoretical analysis assessing the strength of their LP relaxations. Additionally, the
    exact methods presented in this paper undergo a thorough comparison through an extensive computational
    campaign involving a set of real-world and synthetic instances. Our tests aim to evaluate the performance
    of the exact algorithms and identify the features of instances that can be solved with proven optimality.
    { }
