abstract: In Vertex Coloring Problems, one is required to assign a color to each vertex of an undirected
  graph in such a way that adjacent vertices receive different colors, and the objective is to minimize
  the cost of the used colors. In this work we solve four different coloring problems formulated as Maximum
  Weight Stable Set Problems on an associated graph. We exploit the transformation proposed by Cornaz
  and Jost, where given a graph G, an auxiliary graph G is constructed, such that the family of all stable
  sets of G is in one-to-one correspondence with the family of all feasible colorings of G. The transformation
  in was originally proposed for the classical Vertex Coloring and the Max-Coloring problems; we extend
  it to the Equitable Coloring Problem and the Bin Packing Problem with Conflicts. We discuss the relation
  between the Maximum Weight Stable formulation and a polynomial-size formulation for the VCP, proposed
  by Campeˆlo, Correˆa and Campos [4] and called the Representative formulation. We report extensive computational
  experiments on benchmark instances of the four problems, and compare the solution method with the state-of-the-art
  algorithms. By exploiting the proposed method, we largely outperform the state-of-the-art algorithm
  for the Max-coloring Problem, and we are able to solve, for the first time to proven optimality, 14
  Max-coloring and 2 Equitable Coloring instances.
