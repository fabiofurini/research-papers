abstract: >-
  Given an undirected graph, the k-vertex cut problem asks for a minimum-cost set
  of vertices whose removal yields at least k connected components. We introduce
  an extended integer linear programming formulation that unifies and strengthens
  existing models and forms the basis of a branch-and-price algorithm. The method
  combines tailored branching rules, valid inequalities and symmetry handling.
  It dominates the linear relaxations of previous formulations and substantially
  improves the state of the art in both instances solved to optimality and running
  times.
