abstract: >-
  We study the Bin Packing Problem with Setups, where packing items from a class
  in a bin incurs an additional setup weight and cost. The paper compares a
  natural integer programming formulation with an arc-flow formulation, derives
  strengthening inequalities and bounds, and evaluates both models on generated
  and real-world instances.
