abstract: This paper investigates two-dimensional knapsack problems modeled as a Generalized Two-Dimensional
  Knapsack Problem, which has not been studied previously in the literature and whose importance arises
  in designing Branch-Price-and-Cut (BPC) algorithms for the classic Two-Dimensional Bin-Packing Problem.
  We propose a novel exact solution framework and design both non-numerically exact and numerically exact
  algorithms tailored to the, which effectively solve the generated problem instances. The proposed framework
  demonstrates state-of-the-art performance on the well-known Two-Dimensional Knapsack Problem with and
  without item conflicts and on the basic Two-Dimensional Orthogonal Packing Problem, solving several
  previously unsolved instances and providing new benchmark results. These findings demonstrate the framework's
  potential for inspiring algorithm development for higher-dimensional problems and pricing algorithms
  in other related BPC techniques. To facilitate these interesting future research directions, the algorithm
  code, instance data, and detailed results are made openly accessible.
